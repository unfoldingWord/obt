<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png">
  <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest">
  <link rel="mask-icon" href="%PUBLIC_URL%/safari-pinned-tab.svg" color="#209149">
  <meta name="apple-mobile-web-app-title" content="Open Bible Text">
  <meta name="application-name" content="Open Bible Text">
  <meta name="msapplication-TileColor" content="#00aba9">
  <meta name="theme-color" content="#209149">
  <meta name="description"
    content="An application for advanced Bible study using opensource materials from git.door43.org." />

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f6f7f2;
    }

    #root {
      min-height: 100vh;
    }

    .app-boot-loader {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background:
        radial-gradient(circle at top, rgba(32, 145, 73, 0.18), transparent 42%),
        linear-gradient(180deg, #f6f7f2 0%, #eef4ea 100%);
      color: #204236;
      font-family: Roboto, sans-serif;
      text-align: center;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    .app-boot-loader--hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .app-boot-loader__spinner {
      width: 54px;
      height: 54px;
      border-radius: 999px;
      border: 4px solid rgba(32, 145, 73, 0.15);
      border-top-color: #209149;
      animation: app-boot-loader-spin 0.9s linear infinite;
      box-shadow: 0 10px 25px rgba(32, 145, 73, 0.18);
    }

    .app-boot-loader__title {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .app-boot-loader__subtitle {
      max-width: 280px;
      font-size: 14px;
      line-height: 1.5;
      color: rgba(32, 66, 54, 0.78);
    }

    @keyframes app-boot-loader-spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-boot-loader {
        transition: none;
      }

      .app-boot-loader__spinner {
        animation: none;
      }
    }
  </style>
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->

  <title>Open Bible Text</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="app-boot-loader" class="app-boot-loader" role="status" aria-live="polite">
    <div class="app-boot-loader__spinner" aria-hidden="true"></div>
    <div class="app-boot-loader__title">Opening Open Bible Text</div>
    <div class="app-boot-loader__subtitle">
      Loading the app and resources for your first session.
    </div>
  </div>
  <div id="root"></div>

      This HTML file is a template.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
</body>

</html>
